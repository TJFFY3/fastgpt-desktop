appId: org.fastgpt.desktop
productName: FastGPT Desktop
directories:
  output: ../../release
electronDist: ../../node_modules/electron/dist
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: native-build
    to: safe-files
  - from: ../../packages/sandbox/image
    to: sandbox-image
    filter:
      - Dockerfile
      - runner.py
      - transfer.py
      - .dockerignore
mac:
  category: public.app-category.productivity
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: 点击录音时使用麦克风；完成后将音频发送到您配置的转写服务，文字由您确认插入草稿。
win:
  target: nsis
linux:
  target: AppImage
